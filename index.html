<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eason Li 李柏均｜活動與舞台攝影</title>
  <meta name="description" content="一場校園才藝表演：舞台、觀眾與排練的二十個瞬間。">
  <!-- appearance:start (Codex: font links and theme-color go here) -->
  <meta name="theme-color" content="#111110">
  <!-- appearance:end -->
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"></h1>
    <p class="site-tagline"></p>
  </header>

  <main>
    <section class="intro" aria-label="關於這組作品"></section>
    <ul class="gallery" role="list"></ul>
    <noscript>
      <p>這個作品集需要 JavaScript 才能顯示照片，請開啟後重新整理頁面。</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <p class="site-contact"></p>
    <p class="site-credit"></p>
  </footer>

  <dialog class="lightbox" aria-label="照片檢視">
    <figure class="lightbox-figure">
      <img class="lightbox-img" alt="">
      <figcaption class="lightbox-caption">
        <span class="lightbox-counter"></span>
        <span class="lightbox-text"></span>
      </figcaption>
    </figure>
    <button class="lightbox-close" type="button" aria-label="關閉">×</button>
    <button class="lightbox-prev" type="button" aria-label="上一張">‹</button>
    <button class="lightbox-next" type="button" aria-label="下一張">›</button>
  </dialog>

  <script src="photos.js"></script>
  <script src="app.js"></script>
</body>
</html>
